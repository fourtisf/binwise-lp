# Nginx site for Binwise. Replace YOUR_DOMAIN, copy to /etc/nginx/sites-available/binwise,
# symlink into sites-enabled, then run: sudo certbot --nginx -d YOUR_DOMAIN
# (certbot adds the HTTPS server block and the HTTP→HTTPS redirect).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name YOUR_DOMAIN;

  client_max_body_size 1m;

  # API + WebSocket stream. /api/pools → http://127.0.0.1:4000/pools
  location /api/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Website (landing + app)
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
