# Nginx site for Kovra. deploy/install.sh fills in YOUR_DOMAIN, WEB_PORT and API_PORT and runs certbot,
# which adds HTTPS to both server blocks and the HTTP→HTTPS redirect.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# www → bare domain, so the site has one origin (wallet sign-in checks the domain).
server {
  listen 80;
  listen [::]:80;
  server_name www.YOUR_DOMAIN;
  return 301 https://YOUR_DOMAIN$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name YOUR_DOMAIN;

  client_max_body_size 1m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  # Browsers ignore this over plain HTTP; it takes effect once certbot has added HTTPS.
  add_header Strict-Transport-Security "max-age=31536000" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API + WebSocket stream. /api/pools → http://127.0.0.1:API_PORT/pools
  location /api/ {
    proxy_pass http://127.0.0.1:API_PORT/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Website (landing + app)
  location / {
    proxy_pass http://127.0.0.1:WEB_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
